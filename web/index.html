<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络实验陪练</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4d8df7" stroke-width="1.6">
        <circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/>
        <circle cx="12" cy="18" r="2.2"/>
        <path d="M7 7l3.6 9M17 7l-3.6 9M7.2 6h9.6"/>
      </svg>
      <div>
        <b>网络实验陪练</b>
        <span>eNSP · DeepSeek</span>
      </div>
    </div>

    <div class="sec sec-toggle" id="secLabs">
      <span>实验库 <b id="labCount" class="cnt">0</b></span>
      <span class="caret">▾</span>
    </div>
    <button id="btnGen" class="gen-btn">＋ 用一句话生成实验</button>
    <div id="labList" class="lab-list scroll-box"></div>

    <div class="sec">步骤</div>
    <div id="stepper" class="stepper"></div>

    <div class="sec">试卷</div>
    <div id="examBox" class="exam-box"></div>

    <div class="sec sec-toggle" id="secKb">
      <span>原理库 <b id="kbCount" class="cnt">0</b></span>
      <span class="caret">▾</span>
    </div>
    <div id="kbCatsSide" class="kb-side"></div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="titles">
        <h1 id="labTitle">选一个实验开始</h1>
        <p id="labSub">左边挑一个，然后点右上角「一键搭建」</p>
        <div id="labMeta" class="meta-line"></div>
      </div>
      <div class="top-actions">
        <button id="btnBuild" class="btn primary">一键搭建</button>
        <button id="btnGrade" class="btn">交卷</button>
        <button id="btnKB" class="btn ghost" title="查底层原理（Ctrl+K）">原理</button>
        <button id="btnCourse" class="btn ghost" title="按考纲排好的十站路线">路线</button>
        <button id="btnHelp" class="btn ghost" title="使用手册">帮助</button>
        <button id="btnFloat" class="btn ghost" title="开一个贴边小窗，钉在 eNSP 旁边">小窗</button>
        <button id="btnTheme" class="btn ghost theme-btn" title="切换主题：苹果 / 华为">
          <span class="brand brand-apple"><img src="assets/apple.png" alt=""></span>
          <span class="brand brand-huawei"><img src="assets/huawei.svg" alt=""></span>
        </button>
        <button id="btnReset" class="btn ghost" title="清掉当前实验的进度和拓扑">重置</button>
      </div>
    </header>

    <div class="bar"><i id="bar"></i></div>

    <div id="devices" class="devices"></div>
    <div id="devbar" class="devbar">
      <button id="btnDiscover" class="mini">重新识别端口</button>
      <button id="btnMermaid" class="mini">导出拓扑图</button>
      <button id="btnSave" class="mini">保存到设备</button>
      <button id="btnCalib" class="mini">校准启动按钮</button>
      <button id="btnReport" class="mini">导出实验报告</button>
    </div>
    <div id="notice" class="notice hidden"></div>
    <div id="symptom" class="symptom hidden"></div>

    <section id="stepCard" class="card step-card hidden">
      <div class="step-head">
        <span id="stepNo" class="step-no">01</span>
        <div>
          <h2 id="stepTitle"></h2>
          <p id="stepBrief" class="brief"></p>
        </div>
      </div>
      <div id="stepWhy" class="why"></div>
      <div class="actions">
        <button id="btnCheck" class="btn primary">检查这一步</button>
        <button id="btnHint" class="btn">给我提示</button>
        <button id="btnDiag" class="btn">看我配到哪了</button>
        <button id="btnDiff" class="btn ghost">对比标准配置</button>
        <button id="btnAnswer" class="btn ghost">看答案</button>
        <button id="btnApply" class="btn ghost">帮我做</button>
      </div>
      <div id="hintBox" class="hint hidden"></div>
      <div id="output" class="output hidden"></div>
    </section>

    <section id="empty" class="card empty">
      <p>还没有选实验。</p>
    </section>
  </main>

  <aside class="ai">
    <div class="ai-head" id="aiHead" title="未配置时点这里填 Key">
      <span class="dot" id="aiDot"></span>
      <div>
        <b>实验助教</b>
        <span id="aiState">DeepSeek</span>
      </div>
    </div>
    <div id="chat" class="chat">
      <div class="msg bot">卡住了就直接问。我会看着你当前的步骤和刚才的命令回显回答，不会一上来就把整段配置倒给你。</div>
    </div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="比如：我 trunk 配了还是不通"></textarea>
      <button id="btnSend" class="btn primary send">发送</button>
    </div>
    <div class="quick">
      <button data-q="我卡在这一步了，帮我看看从哪下手">卡在这一步了</button>
      <button data-q="帮我看看刚才的回显，问题出在哪">看看回显</button>
      <button data-q="这一步为什么要这么做，原理讲一下">讲讲原理</button>
    </div>
  </aside>
</div>
<div id="toast" class="toast"></div>

<div id="genModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3>用一句话生成实验</h3>
        <p>说清你想练什么，我来出拓扑、拆步骤、配检查点</p>
      </div>
      <button id="genClose" class="x">×</button>
    </div>

    <div id="genForm">
      <textarea id="genBrief" rows="3" placeholder="比如：三台交换机做链路聚合，两条线捆成一条，然后验证带宽叠加"></textarea>
      <div class="chips">
        <button data-b="两台交换机做链路聚合，两边各用两条线捆成一个 Eth-Trunk，验证带宽叠加">链路聚合</button>
        <button data-b="一台三层交换机和两台接入交换机，划三个 VLAN，用 OSPF 让 VLAN 间互通">VLAN + OSPF</button>
        <button data-b="用 ACL 禁止 192.168.10.0/24 访问服务器 192.168.20.100，其他流量放行">ACL 控制</button>
        <button data-b="两台路由器做 NAT，内网 PC 用 easy-ip 出公网，再验证内网地址被转换">NAT 出网</button>
      </div>
      <div class="modal-actions">
        <button id="genGo" class="btn primary">生成实验</button>
      </div>
    </div>

    <div id="genLoading" class="hidden">
      <div class="spinner"></div>
      <p id="genStep">正在设计拓扑…</p>
    </div>

    <div id="genResult" class="hidden"></div>
    <div id="genError" class="hidden"></div>

    <div id="genRun" class="hidden">
      <div class="run-head">
        <span id="runStage">正在生成拓扑…</span>
        <span id="runCount"></span>
      </div>
      <div id="runLog" class="run-log"></div>
      <div id="runError" class="run-error hidden"></div>
      <div class="modal-actions">
        <button id="runBack" class="btn ghost">关掉</button>
        <button id="runGo" class="btn primary hidden">开始做这个</button>
      </div>
    </div>
  </div>
</div>

<div id="examModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3>组一份试卷</h3>
        <p>勾几个实验，每个做完交一次卷，分数累加成总分</p>
      </div>
      <button id="examClose" class="x">×</button>
    </div>
    <div id="examPick" class="pick"></div>
    <div class="modal-actions"><button id="examSave" class="btn primary">就这份</button></div>
  </div>
</div>

<div id="gradeModal" class="modal hidden">
  <div class="modal-box narrow">
    <div class="modal-head">
      <div>
        <h3 id="gradeTitle">成绩单</h3>
        <p id="gradeSub"></p>
      </div>
      <button id="gradeClose" class="x">×</button>
    </div>
    <div id="gradeBody"></div>
    <div class="modal-actions" id="gradeActs"></div>
  </div>
</div>

<div id="kbModal" class="modal hidden">
  <div class="modal-box kb-box">
    <div class="modal-head">
      <div>
        <h3>原理库</h3>
        <p>HCIA / HCIP / HCIE 知识点，从机制讲起，配一个生活化的比喻</p>
      </div>
      <button id="kbClose" class="x">×</button>
    </div>
    <div class="kb-add">
      <input id="kbNewTitle" placeholder="新增知识点：写个名字，例如 QinQ 双层 VLAN">
      <select id="kbNewLevel">
        <option>HCIA</option><option>HCIP</option><option>HCIE</option>
      </select>
      <select id="kbNewCat">
        <option>交换</option><option>路由</option><option>安全</option>
        <option>高可用</option><option>广域</option><option>IPv6</option><option>自动化</option>
      </select>
      <button id="kbNewGo" class="btn primary">生成入库</button>
    </div>
    <div class="kb-body">
      <div class="kb-left">
        <input id="kbQ" placeholder="搜：LSA、三次握手、VRRP 选举…">
        <div id="kbCats" class="kb-cats"></div>
        <div id="kbList" class="kb-list"></div>
      </div>
      <div id="kbDetail" class="kb-detail"><div class="kb-empty">左边选一个知识点</div></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
