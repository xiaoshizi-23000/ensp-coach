<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eNSP 陪练</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-size:13px;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh}
  .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .hd .t{flex:1;min-width:0}
  .hd b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd span{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd select{
    max-width:120px;font-size:11px;background:var(--panel2);color:var(--dim);
    border:1px solid var(--line);border-radius:6px;padding:3px 4px
  }
  .bar{margin:0;height:2px;border-radius:0}
  .body{flex:1;overflow-y:auto;padding:12px 12px 4px}
  .no{font:600 11px ui-monospace,Consolas,monospace;color:var(--accent);border:1px solid var(--accent-bd);
    border-radius:5px;padding:2px 6px;display:inline-block;margin-bottom:6px}
  .st-title{font-size:14px;font-weight:600;margin:0 0 6px;line-height:1.45}
  .st-brief{color:var(--dim);font-size:12.3px;margin:0 0 10px;line-height:1.7}
  .why{font-size:11.8px;margin-top:0;padding:8px 10px}
  .acts{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .acts .btn{flex:1;padding:8px 0;text-align:center;font-size:12.5px}
  .out{padding:0 12px 10px;max-height:34vh;overflow-y:auto}
  .res{font-size:12px;padding:7px 0}
  .res .raw{max-height:110px;font-size:11.5px;margin-top:5px}
  .hint{margin:0 12px 10px;font-size:12px;padding:9px 11px;white-space:pre-wrap}
  .steps{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dot-s{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;
    font-size:10.5px;color:var(--faint);cursor:pointer;background:var(--panel2)}
  .dot-s.on{border-color:var(--accent);color:var(--accent)}
  .dot-s.done{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
  .sc{font-size:11.5px;color:var(--dim);margin-left:auto;display:flex;align-items:center;gap:6px}
  .sc b{color:var(--ok);font-size:13px}
  .tip{font-size:11px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d8df7" stroke-width="1.8">
      <circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/>
      <path d="M7 7l3.6 9M17 7l-3.6 9M7.2 6h9.6"/>
    </svg>
    <div class="t"><b id="labTitle">加载中…</b><span id="labSub"></span></div>
    <select id="labPick"></select>
    <button id="btnTheme" class="x theme-btn" title="切换主题"><span class="brand brand-apple"><img src="assets/apple.png" alt=""></span><span class="brand brand-huawei"><img src="assets/huawei.svg" alt=""></span></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="steps" id="dots"></div>
  <div class="body">
    <div class="no" id="stNo">01</div>
    <h2 class="st-title" id="stTitle"></h2>
    <p class="st-brief" id="stBrief"></p>
    <div class="why hidden" id="stWhy"></div>
    <div id="hint" class="hint hidden"></div>
  </div>
  <div class="out" id="out"></div>
  <div class="acts">
    <button id="btnCheck" class="btn primary">检查</button>
    <button id="btnHint" class="btn">提示</button>
    <button id="btnGrade" class="btn ghost">交卷</button>
  </div>
  <div class="tip" id="tip">按 Ctrl+S 保存拓扑，否则重开会复位</div>
</div>
<script src="client.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let S = { labs: [], lab: null, step: null, hintLevel: 0, done: [] };

async function api(p, b) {
  return window.enspJSON(p, b);
}

function theme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("theme", t);
}
theme(localStorage.getItem("theme") || "apple");
$("#btnTheme").onclick = () => theme(document.documentElement.dataset.theme === "apple" ? "huawei" : "apple");

async function boot() {
  const r = await api("/api/labs");
  S.labs = r.labs || [];
  const sel = $("#labPick");
  sel.innerHTML = "";
  S.labs.forEach((l) => {
    const o = document.createElement("option");
    o.value = l.id; o.textContent = l.title;
    sel.appendChild(o);
  });
  const want = localStorage.getItem("lab");
  await openLab(S.labs.some((l) => l.id === want) ? want : (S.labs[0] && S.labs[0].id));
  sel.onchange = () => openLab(sel.value);
}

async function openLab(id) {
  if (!id) return;
  const r = await api("/api/lab/" + id);
  if (!r || !r.ok || !r.lab) {
    $("#labTitle").textContent = "实验加载失败";
    $("#labSub").textContent = (r && r.error) || "回主界面重新选一个实验";
    return;
  }
  S.lab = r.lab; S.done = (r.progress && r.progress.done) || [];
  localStorage.setItem("lab", id);
  $("#labPick").value = id;
  $("#labTitle").textContent = S.lab.title;
  $("#labSub").textContent = S.lab.subtitle;
  const cur = S.lab.steps.find((s) => !S.done.includes(s.id)) || S.lab.steps[0];
  show(cur.id);
  renderDots();
}
function renderDots() {
  const box = $("#dots");
  box.innerHTML = "";
  S.lab.steps.forEach((s, i) => {
    const d = el("div", "dot-s" + (s.id === S.step.id ? " on" : "") + (S.done.includes(s.id) ? " done" : ""), "");
    d.textContent = S.done.includes(s.id) ? "✓" : String(i + 1);
    d.onclick = () => show(s.id);
    box.appendChild(d);
  });
  const sc = el("div", "sc");
  sc.innerHTML = `进度 <b>${S.done.length}/${S.lab.steps.length}</b>`;
  box.appendChild(sc);
  $("#bar").style.width = Math.round((S.done.length / S.lab.steps.length) * 100) + "%";
}
function show(id) {
  const s = S.lab.steps.find((x) => x.id === id);
  if (!s) return;
  S.step = s; S.hintLevel = 0;
  $("#stNo").textContent = String(S.lab.steps.indexOf(s) + 1).padStart(2, "0");
  $("#stTitle").textContent = s.title;
  $("#stBrief").textContent = s.brief;
  $("#stWhy").textContent = s.why || "";
  $("#stWhy").classList.remove("hidden");
  $("#hint").classList.add("hidden");
  $("#out").innerHTML = "";
  renderDots();
}

async function check() {
  if (!S.lab || !S.step) return;
  $("#btnCheck").disabled = true;
  const r = await api(`/api/lab/${S.lab.id}/step/${S.step.id}/check`, {});
  $("#btnCheck").disabled = false;
  const box = $("#out");
  box.innerHTML = "";
  if (r.error) { box.appendChild(el("div", "res", r.error)); return; }
  (r.results || []).forEach((x) => {
    const row = el("div", "res " + (x.pass ? "pass" : "fail"));
    row.appendChild(el("span", "ic", x.pass ? "✓" : "✗"));
    row.appendChild(el("span", null, `${x.dev} ${x.cmd}`));
    if (!x.pass && x.output) row.appendChild(el("pre", "raw", x.output.slice(-300)));
    box.appendChild(row);
  });
  if (r.ok) {
    if (!S.done.includes(S.step.id)) S.done.push(S.step.id);
    renderDots();
    const next = S.lab.steps.find((s) => !S.done.includes(s.id));
    const b = el("button", "btn primary", next ? "下一步 →" : "全部做完，去交卷");
    b.style.width = "100%";
    b.style.marginTop = "8px";
    b.onclick = () => { if (next) show(next.id); else grade(); };
    box.appendChild(b);
  }
}

async function hint() {
  if (!S.step) return;
  const total = typeof S.step.hintTotal === "number" ? S.step.hintTotal : 3;
  if (S.hintLevel >= total) return;
  S.hintLevel = Math.min(3, S.hintLevel + 1);
  const r = await api(`/api/lab/${S.lab.id}/step/${S.step.id}/hint`, { level: S.hintLevel });
  const h = $("#hint");
  h.classList.remove("hidden");
  if (!r.hint) { h.textContent = r.note || "这一步没有更多提示了。"; return; }
  h.textContent = ["① ", "② ", "③ "][r.level - 1] + r.hint;
}

async function grade() {
  if (!S.lab) return;
  if (!confirm("重跑所有检查点并判分？")) return;
  const r = await api(`/api/lab/${S.lab.id}/grade`, {});
  const box = $("#out");
  box.innerHTML = "";
  if (!r.ok) { box.appendChild(el("div", "res", r.error || "判分失败")); return; }
  box.appendChild(el("div", "res", `得分 ${r.score} / 100 · ${r.grade}`));
  box.appendChild(el("div", "res", "已记入复盘历史和考证路线进度，成绩单在主界面"));
  r.rows.forEach((x, i) => box.appendChild(el("div", "res " + (x.pass ? "pass" : "fail"),
    `${i + 1}. ${x.title}  ${x.score}/${x.full}`)));
}

$("#btnCheck").onclick = check;
$("#btnHint").onclick = hint;
$("#btnGrade").onclick = grade;
boot();
setInterval(async () => {
  const want = localStorage.getItem("lab");
  if (want && S.lab && want !== S.lab.id) openLab(want);
  if (!S.lab) return;
  try {
    const st = await api(`/api/lab/${S.lab.id}/status`);
    const tip = $("#tip");
    if (st && st.total) {
      tip.textContent = (st.up === st.total
        ? `环境已就绪，${st.up}/${st.total} 台设备在线`
        : `设备启动中 ${st.up}/${st.total}`) + " · 按 Ctrl+S 保存拓扑";
    } else {
      tip.textContent = "这个实验还没搭环境，去主界面点「一键搭建」";
    }
  } catch (e) { /* 服务没起就保持原样 */ }
}, 5000);
</script>
</body>
</html>
