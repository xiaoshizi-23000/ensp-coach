<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用手册 · 网络实验陪练</title>
<link rel="stylesheet" href="style.css">
<style>
  body{overflow:hidden}
  .hh{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);
    background:var(--panel)}
  .hh a{font-size:12.5px;color:var(--dim);text-decoration:none;padding:4px 10px;
    border:1px solid var(--line);border-radius:14px}
  .hh a:hover{color:var(--text);border-color:var(--accent-bd)}
  .hh h1{margin:0;font-size:15px;font-weight:600}
  .hh .sp{flex:1}
  .wrap{display:grid;grid-template-columns:250px minmax(0,1fr);height:calc(100vh - 55px)}
  .toc{border-right:1px solid var(--line);padding:18px 14px;overflow-y:auto;background:var(--panel)}
  .toc a{display:block;font-size:12.5px;color:var(--dim);text-decoration:none;padding:5px 9px;
    border-radius:7px;line-height:1.5}
  .toc a:hover{background:var(--panel2);color:var(--text)}
  .toc a.on{background:var(--panel2);color:var(--accent)}
  .doc{overflow-y:auto;padding:32px 52px 120px}
  .doc-inner{max-width:820px;margin:0 auto}
  .doc h2{font-size:17px;font-weight:600;margin:34px 0 12px;padding-top:10px;
    border-top:1px solid var(--line)}
  .doc h2:first-child{border-top:none;margin-top:0;padding-top:0}
  .doc h3{font-size:14px;font-weight:600;margin:18px 0 8px;color:var(--dim)}
  .doc p{font-size:13.5px;line-height:2;margin:10px 0;color:var(--text)}
  .doc ul{margin:10px 0;padding-left:20px}
  .doc li{font-size:13.5px;line-height:1.95;margin:5px 0}
  .doc pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    overflow:auto;font:12px/1.7 ui-monospace,Consolas,monospace;color:var(--dim);margin:12px 0}
  .doc code{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font:12px ui-monospace,Consolas,monospace;color:var(--accent)}
</style>
</head>
<body>
<div class="hh">
  <a href="/">← 回实验台</a>
  <a href="/kb">原理库</a>
  <h1>使用手册</h1>
  <span class="sp"></span>
  <button id="theme" class="x theme-btn" title="切换主题"><span class="brand brand-apple"><img src="assets/apple.png" alt=""></span><span class="brand brand-huawei"><img src="assets/huawei.svg" alt=""></span></button>
</div>
<div class="wrap">
  <nav class="toc" id="toc"></nav>
  <div class="doc" id="doc"><div class="doc-inner">加载中…</div></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("theme", t);
}
setTheme(localStorage.getItem("theme") || "apple");
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "apple" ? "huawei" : "apple");

function render(md) {
  const lines = md.split(/\r?\n/);
  const toc = [];
  let html = "", inCode = false, para = [], list = [], n = 0;
  const flushPara = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  const flushList = () => { if (list.length) { html += "<ul>" + list.map((x) => "<li>" + x + "</li>").join("") + "</ul>"; list = []; } };
  const flush = () => { flushPara(); flushList(); };

  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      flush();
      html += inCode ? "</pre>" : "<pre>";
      inCode = !inCode;
      continue;
    }
    if (inCode) { html += esc(line) + "\n"; continue; }
    if (/^[一二三四五六七八九十]+、/.test(line)) {
      flush(); n++;
      html += `<h2 id="s${n}">${esc(line)}</h2>`;
      toc.push([`s${n}`, line]);
      continue;
    }
    if (/^\d+\.\d+/.test(line)) { flush(); html += `<h3>${esc(line)}</h3>`; continue; }
    if (/^[-*]\s+/.test(line)) { flushPara(); list.push(esc(line.replace(/^[-*]\s+/, ""))); continue; }
    if (!line.trim()) { flush(); continue; }
    flushList();
    para.push(esc(line));
  }
  flush();
  if (inCode) html += "</pre>";
  return { html, toc };
}

async function boot() {
  const md = await (await fetch("/manual.md")).text();
  const { html, toc } = render(md);
  $("#doc").innerHTML = '<div class="doc-inner">' + html + "</div>";
  const nav = $("#toc");
  nav.innerHTML = "";
  toc.forEach(([id, text]) => {
    const a = document.createElement("a");
    a.href = "#" + id;
    a.textContent = text;
    a.onclick = (e) => {
      e.preventDefault();
      document.getElementById(id).scrollIntoView({ behavior: "smooth", block: "start" });
      nav.querySelectorAll("a").forEach((x) => x.classList.remove("on"));
      a.classList.add("on");
    };
    nav.appendChild(a);
  });
  const box = $("#doc");
  box.addEventListener("scroll", () => {
    let cur = null;
    toc.forEach(([id]) => {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top < 120) cur = id;
    });
    nav.querySelectorAll("a").forEach((x) => x.classList.toggle("on", x.getAttribute("href") === "#" + cur));
  });
}
boot();
</script>
</body>
</html>
